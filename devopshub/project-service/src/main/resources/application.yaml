server:
  port: 8081

spring:
  application:
    name: project-service

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/devopshub_projects
    username: myuser
    password: secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
